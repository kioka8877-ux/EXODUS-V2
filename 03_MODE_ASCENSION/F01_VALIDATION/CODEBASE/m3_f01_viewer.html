<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M3_F01 — Validation v1.0</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0d0f; color: #e0e0e0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
}
#topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; background: #141416;
  border-bottom: 1px solid #2a2a2e; flex-shrink: 0; flex-wrap: wrap;
}
.logo { font-size: 13px; font-weight: 700; letter-spacing: .12em; color: #c8a96e; text-transform: uppercase; }
.ver  { font-size: 10px; color: #333; }
.divider { width: 1px; height: 24px; background: #2a2a2e; margin: 0 2px; }
.chip {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 9px; border-radius: 4px; background: #1e1e22;
  border: 1px solid #2a2a2e; font-size: 11px; color: #666;
}
.chip .k { color: #c8a96e; font-weight: 600; }
.chip.ok  { border-color: #2a5c2a; color: #4caf50; }
.chip.err { border-color: #5c2a2a; color: #f44336; }
#main { display: flex; flex: 1; overflow: hidden; }
#left-panel {
  width: 300px; background: #141416; border-right: 1px solid #2a2a2e;
  display: flex; flex-direction: column; padding: 14px; gap: 14px;
  overflow-y: auto; flex-shrink: 0;
}
#right-panel {
  flex: 1; display: flex; flex-direction: column;
  padding: 20px 24px; gap: 16px; overflow-y: auto;
}
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec-title {
  font-size: 10px; text-transform: uppercase; letter-spacing: .12em;
  color: #444; padding-bottom: 5px; border-bottom: 1px solid #1e1e22;
}
.toggle-row { display: flex; gap: 6px; }
.tog-btn {
  flex: 1; padding: 8px; border-radius: 6px;
  border: 1px solid #2a2a2e; background: #1c1c20;
  font-size: 11px; color: #777; cursor: pointer; transition: all .18s;
  text-align: center; font-weight: 600;
}
.tog-btn:hover { border-color: #c8a96e; color: #c8a96e; }
.tog-btn.active { border-color: #c8a96e; background: #1a1608; color: #c8a96e; }
.status-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 6px;
  background: #1c1c20; border: 1px solid #2a2a2e; font-size: 12px;
}
.badge {
  padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase;
}
.badge.wait  { background: #222; color: #555; }
.badge.ok    { background: #1a3a1a; color: #4caf50; border: 1px solid #2a5c2a; }
.badge.err   { background: #3a1a1a; color: #f44336; border: 1px solid #5c2a2a; }
.badge.load  { background: #1a2a3a; color: #64b5f6; border: 1px solid #2a4a6a; }
.clip-list { display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow-y: auto; }
.clip-item {
  padding: 6px 10px; border-radius: 5px; border: 1px solid #2a2a2e;
  background: #1c1c20; font-size: 11px; cursor: pointer;
  display: flex; justify-content: space-between; transition: all .15s;
}
.clip-item:hover { border-color: #c8a96e; color: #c8a96e; }
.clip-item.selected { border-color: #c8a96e; background: #1a1608; color: #c8a96e; }
.clip-dur { color: #555; font-size: 10px; }
.clip-item.selected .clip-dur { color: #8a7040; }
/* RIGHT PANEL */
.bar-wrap { display: flex; flex-direction: column; gap: 5px; }
.bar-label { display: flex; justify-content: space-between; font-size: 11px; color: #888; }
.bar-track { height: 12px; background: #1c1c20; border-radius: 4px; border: 1px solid #2a2a2e; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width .4s; }
.bar-gold { background: linear-gradient(90deg, #b8922a, #c8a96e); }
.bar-blue { background: linear-gradient(90deg, #1a5c9a, #64b5f6); }
.result-box {
  padding: 14px 16px; border-radius: 8px; border: 1px solid #2a2a2e;
  background: #141416; display: none; flex-direction: column; gap: 8px;
}
.result-box.show { display: flex; }
.result-ok   { border-color: #2a5c2a; background: #0e1e0e; }
.result-fail { border-color: #5c2a2a; background: #1e0e0e; }
.result-title { font-size: 18px; font-weight: 700; letter-spacing: .08em; }
.result-ok   .result-title { color: #4caf50; }
.result-fail .result-title { color: #f44336; }
.result-detail { font-size: 12px; color: #888; }
pre#json-preview {
  background: #0a0a0c; border: 1px solid #1e1e22; border-radius: 6px;
  padding: 12px; font-size: 11px; color: #6a9f6a; overflow-x: auto;
  white-space: pre-wrap; line-height: 1.6;
}
.btn-confirm {
  padding: 11px 0; border-radius: 7px; border: none; cursor: pointer;
  font-size: 13px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; transition: all .2s; width: 100%;
  background: #c8a96e; color: #0d0d0f;
}
.btn-confirm:disabled {
  background: #222; color: #444; cursor: not-allowed; border: 1px solid #2a2a2e;
}
.btn-confirm:not(:disabled):hover { background: #e0c080; }
.feedback { font-size: 11px; color: #4caf50; text-align: center; min-height: 16px; }
</style>
</head>
<body>

<div id="topbar">
  <span class="logo">M3 — F01</span>
  <span class="ver">Validation v1.0</span>
  <div class="divider"></div>
  <div class="chip"><span class="k">GLB</span><span id="chip-glb">—</span></div>
  <div class="chip"><span class="k">Audio</span><span id="chip-audio">—</span></div>
  <div class="chip" id="chip-result-wrap" style="display:none">
    <span class="k">Résultat</span><span id="chip-result">—</span>
  </div>
</div>

<div id="main">

  <!-- LEFT : CONFIG -->
  <div id="left-panel">

    <div class="sec">
      <div class="sec-title">Mode Audio</div>
      <div class="toggle-row">
        <button class="tog-btn active" id="btn-avec" onclick="setAudio(true)">AVEC AUDIO</button>
        <button class="tog-btn"        id="btn-sans" onclick="setAudio(false)">SANS AUDIO</button>
      </div>
    </div>

    <div class="sec">
      <div class="sec-title">Statut Inputs</div>
      <div class="status-row">
        <span>avatar.glb</span>
        <span class="badge wait" id="badge-glb">ATTENTE</span>
      </div>
      <div class="status-row" id="audio-row">
        <span>audio.mp3</span>
        <span class="badge wait" id="badge-audio">ATTENTE</span>
      </div>
    </div>

    <div class="sec" id="sec-clips" style="display:none">
      <div class="sec-title">Clips Animation — choisir référence</div>
      <div class="clip-list" id="clip-list"></div>
    </div>

    <div style="flex:1"></div>

    <div class="sec">
      <button class="btn-confirm" id="btn-confirm" disabled onclick="saveReport()">
        CONFIRMER &amp; SAUVER
      </button>
      <div class="feedback" id="feedback"></div>
    </div>

  </div>

  <!-- RIGHT : ANALYSE -->
  <div id="right-panel">

    <div class="sec">
      <div class="sec-title">Durées comparées</div>
      <div class="bar-wrap">
        <div class="bar-label"><span>Animation (clip sélectionné)</span><span id="lbl-anim">—</span></div>
        <div class="bar-track"><div class="bar-fill bar-gold" id="bar-anim" style="width:0%"></div></div>
      </div>
      <div class="bar-wrap" id="bar-audio-wrap">
        <div class="bar-label"><span>Audio</span><span id="lbl-audio">—</span></div>
        <div class="bar-track"><div class="bar-fill bar-blue" id="bar-audio" style="width:0%"></div></div>
      </div>
    </div>

    <div class="result-box" id="result-box">
      <div class="result-title" id="result-title">—</div>
      <div class="result-detail" id="result-detail"></div>
    </div>

    <div class="sec">
      <div class="sec-title">Aperçu Rapport JSON</div>
      <pre id="json-preview">// En attente de validation...</pre>
    </div>

  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

// ─── STATE ─────────────────────────────────────────────────────────
const S = {
  hasAudio:      true,
  glbOk:         false,
  audioOk:       false,
  clips:         [],        // [{name, duration}]
  selectedClip:  null,      // {name, duration}
  audioDuration: 0,
  animDuration:  0,
  validOk:       false,
};

// ─── INIT ──────────────────────────────────────────────────────────
window.setAudio = (v) => {
  S.hasAudio = v;
  document.getElementById('btn-avec').classList.toggle('active', v);
  document.getElementById('btn-sans').classList.toggle('active', !v);
  document.getElementById('audio-row').style.display = v ? '' : 'none';
  document.getElementById('bar-audio-wrap').style.display = v ? '' : 'none';
  if (!v) { S.audioOk = true; S.audioDuration = 0; }
  else     { S.audioOk = false; loadAudio(); }
  updateUI();
};

async function init() {
  await loadInfo();
  await loadGLB();
  if (S.hasAudio) await loadAudio();
}

async function loadInfo() {
  try {
    const r = await fetch('/info');
    const d = await r.json();
    if (!d.has_audio) setAudio(false);
  } catch(e) {}
}

async function loadGLB() {
  setBadge('badge-glb', 'load', 'CHARGEMENT');
  document.getElementById('chip-glb').textContent = '…';
  try {
    const res = await fetch('/files/avatar');
    if (!res.ok) throw new Error(res.statusText);
    const buf = await res.arrayBuffer();
    const loader = new GLTFLoader();
    loader.parse(buf, '', (gltf) => {
      S.clips = gltf.animations.map(a => ({ name: a.name, duration: +a.duration.toFixed(3) }));
      S.glbOk = true;
      setBadge('badge-glb', 'ok', `OK — ${S.clips.length} clip${S.clips.length>1?'s':''}`);
      document.getElementById('chip-glb').textContent = `${S.clips.length} clips`;
      document.getElementById('chip-glb').parentElement.className = 'chip ok';
      renderClips();
      if (S.clips.length > 0) selectClip(0);
      updateUI();
    }, (err) => {
      throw err;
    });
  } catch(e) {
    S.glbOk = false;
    setBadge('badge-glb', 'err', 'ERREUR');
    document.getElementById('chip-glb').textContent = 'ERR';
    document.getElementById('chip-glb').parentElement.className = 'chip err';
    updateUI();
  }
}

async function loadAudio() {
  if (!S.hasAudio) return;
  setBadge('badge-audio', 'load', 'CHARGEMENT');
  document.getElementById('chip-audio').textContent = '…';
  try {
    const res = await fetch('/files/audio');
    if (!res.ok) throw new Error(res.statusText);
    const buf = await res.arrayBuffer();
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const decoded = await ctx.decodeAudioData(buf);
    S.audioDuration = +decoded.duration.toFixed(3);
    S.audioOk = true;
    setBadge('badge-audio', 'ok', `OK — ${S.audioDuration.toFixed(2)}s`);
    document.getElementById('chip-audio').textContent = `${S.audioDuration.toFixed(2)}s`;
    document.getElementById('chip-audio').parentElement.className = 'chip ok';
    updateUI();
  } catch(e) {
    S.audioOk = false;
    setBadge('badge-audio', 'err', 'ERREUR');
    document.getElementById('chip-audio').textContent = 'ERR';
    document.getElementById('chip-audio').parentElement.className = 'chip err';
    updateUI();
  }
}

function renderClips() {
  const list = document.getElementById('clip-list');
  list.innerHTML = '';
  S.clips.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'clip-item';
    el.innerHTML = `<span>${c.name}</span><span class="clip-dur">${c.duration.toFixed(3)}s</span>`;
    el.onclick = () => selectClip(i);
    el.id = `clip-${i}`;
    list.appendChild(el);
  });
  document.getElementById('sec-clips').style.display = S.clips.length ? '' : 'none';
}

function selectClip(i) {
  S.selectedClip  = S.clips[i];
  S.animDuration  = S.selectedClip.duration;
  document.querySelectorAll('.clip-item').forEach(el => el.classList.remove('selected'));
  const el = document.getElementById(`clip-${i}`);
  if (el) el.classList.add('selected');
  updateUI();
}

function updateUI() {
  const ready = S.glbOk && (S.audioOk) && S.selectedClip;
  if (!ready) {
    document.getElementById('btn-confirm').disabled = true;
    document.getElementById('result-box').className = 'result-box';
    document.getElementById('chip-result-wrap').style.display = 'none';
    return;
  }

  // Calcul validation
  const animDur  = S.animDuration;
  const audioDur = S.hasAudio ? S.audioDuration : 0;
  const margin   = S.hasAudio ? +(animDur - audioDur).toFixed(3) : 0;
  S.validOk      = !S.hasAudio || (audioDur <= animDur);

  // Barres
  const maxDur = Math.max(animDur, audioDur, 0.01);
  document.getElementById('bar-anim').style.width  = `${(animDur  / maxDur * 100).toFixed(1)}%`;
  document.getElementById('bar-audio').style.width = `${(audioDur / maxDur * 100).toFixed(1)}%`;
  document.getElementById('lbl-anim').textContent  = `${animDur.toFixed(3)}s`;
  document.getElementById('lbl-audio').textContent = S.hasAudio ? `${audioDur.toFixed(3)}s` : '—';

  // Résultat
  const box = document.getElementById('result-box');
  box.className = 'result-box show ' + (S.validOk ? 'result-ok' : 'result-fail');
  document.getElementById('result-title').textContent = S.validOk ? '✓  VALIDATION OK' : '✗  VALIDATION FAIL';
  document.getElementById('result-detail').textContent = S.hasAudio
    ? (S.validOk
        ? `Marge : ${margin.toFixed(3)}s — audio tient dans l'animation`
        : `Dépassement : ${(-margin).toFixed(3)}s — audio dépasse l'animation`)
    : `Mode sans audio — durée animation : ${animDur.toFixed(3)}s`;

  // Chip résultat
  const chipR = document.getElementById('chip-result');
  chipR.textContent = S.validOk ? 'OK' : 'FAIL';
  document.getElementById('chip-result-wrap').style.display = '';
  document.getElementById('chip-result-wrap').className = 'chip ' + (S.validOk ? 'ok' : 'err');

  // Bouton confirmer
  document.getElementById('btn-confirm').disabled = !S.validOk;

  // JSON preview
  const report = buildReport();
  document.getElementById('json-preview').textContent = JSON.stringify(report, null, 2);
}

function buildReport() {
  const animDur  = S.animDuration;
  const audioDur = S.hasAudio ? S.audioDuration : 0;
  return {
    status:         S.validOk ? "OK" : "FAIL",
    has_audio:      S.hasAudio,
    audio_duration: S.hasAudio ? audioDur : null,
    anim_duration:  animDur,
    selected_clip:  S.selectedClip ? S.selectedClip.name : null,
    all_clips:      S.clips.map(c => ({ name: c.name, duration: c.duration })),
    margin_s:       S.hasAudio ? +(animDur - audioDur).toFixed(3) : null,
  };
}

window.saveReport = async () => {
  const btn = document.getElementById('btn-confirm');
  const fb  = document.getElementById('feedback');
  btn.disabled = true;
  fb.textContent = 'Sauvegarde en cours…';
  fb.style.color = '#c8a96e';
  try {
    const r = await fetch('/save-report', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(buildReport())
    });
    const d = await r.json();
    if (d.ok) {
      fb.textContent = `Sauvé sur Drive ✓`;
      fb.style.color = '#4caf50';
    } else {
      throw new Error(d.error || 'Erreur inconnue');
    }
  } catch(e) {
    fb.textContent = `Erreur : ${e.message}`;
    fb.style.color = '#f44336';
    btn.disabled = false;
  }
};

function setBadge(id, cls, txt) {
  const el = document.getElementById(id);
  el.className = `badge ${cls}`;
  el.textContent = txt;
}

init();
</script>
</body>
</html>
